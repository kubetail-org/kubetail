[package]
name = "cluster_agent"
version = "0.0.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
rgkl = { path = "../rgkl" }
types = {path="../types/"}

prost = { workspace = true}
prost-types = { workspace = true}

tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }

tonic = { workspace = true, features = ["gzip", "tls-ring"] }
tonic-health = { workspace = true}
tonic-reflection = { workspace = true}

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry", "std", "json"] }
tracing-test = { workspace = true }

notify = { workspace = true}
notify-debouncer-full = "0.7.0"

chrono = { workspace = true}
tempfile = { workspace = true }
thiserror = { workspace = true }

anyhow = "1.0.104"
colored = "3.1.1"
either = "1.19.0"

kube = { version = "5.0.0" }
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
regex = "1.13.1"
clap = { version = "4.6.7", features = ["cargo"] }
config = "0.15.27"
serde = "1.0"
serde_json = "1.0"
subst = "0.3.8"
moka = { version = "0.12", features = ["future"] }
secrecy = "0.10"
x509-parser = "0.18"

[dev-dependencies]
serial_test = "3.5.0"
rcgen = "0.13"

