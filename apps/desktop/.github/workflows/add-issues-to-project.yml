name: Add issues to project

permissions:
  contents: read

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add · Issue to project
    if: github.repository == 'kstackhq/kstack'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/kubetail-org/projects/1
          github-token: ${{ secrets.ADD_ISSUES_TO_PROJECT_TOKEN }}
