---
# Dependabot moves dependencies, never toolchains: the Go, Rust, Node, pnpm
# and kubectl pins are bumped by hand (docs/security-model.md lists them).
#
# Every ecosystem waits a week after a release (a week for a compromised
# release to be caught and pulled first), groups minor and patch updates into
# one weekly PR, and leaves each major in a PR of its own, except for packages
# that must move together, which share a group across all update types.
# Security updates skip the wait and arrive grouped.
version: 2
updates:
  # Every action is pinned to a commit SHA; this moves the pins and the
  # version comments beside them.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, ci/cd]
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # /tools holds actionlint, govulncheck and staticcheck, so CI's copies move with the rest.
  - package-ecosystem: gomod
    directories:
      - /sidecar
      - /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/go]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # actionlint v1.7.12 builds only against rc.3; a later rc breaks lint-yaml
      # (rhysd/actionlint#765). Drop this once an actionlint release moves past it.
      - dependency-name: go.yaml.in/yaml/v4
    groups:
      # client-go and apimachinery release in lockstep.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/rust]
    commit-message:
      prefix: chore
      include: scope
    # Tauri's crates and its npm packages must share a major.minor, and no
    # group spans ecosystems: those bumps are made by hand, in one PR. A
    # plugin's minor can require a newer tauri minor, so plugins wait too.
    ignore:
      - dependency-name: tauri
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tauri-build
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tauri-plugin-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # system-configuration's API takes core-foundation's types, so the two
      # must share a core-foundation version and move together.
      core-foundation:
        patterns:
          - core-foundation
          - system-configuration
      rust:
        update-types: [minor, patch]
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/ts+react]
    commit-message:
      prefix: chore
      include: scope
    versioning-strategy: increase
    ignore:
      # See cargo's ignore.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@tauri-apps/cli"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Its major tracks the Node major CI runs; bumped by hand with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # cli and client-preset share plugin-helpers, so their majors land together.
      graphql-codegen:
        patterns:
          - "@graphql-codegen/*"
      npm:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
