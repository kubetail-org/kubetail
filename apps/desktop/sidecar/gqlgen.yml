schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - github.com/kubetail-org/kubetail/apps/desktop/sidecar/graph/model

models:
  # --- Cluster ---
  # The GraphQL Cluster types bind 1:1 (same name) into internal/services/cluster —
  # gqlgen autobinds with no wrapper. The schema mirrors beehive's
  # owner chain: Cluster.status is the Cluster kind's stored status, and the
  # ClusterCache child carries the ClusterCache kind's sync status (`status`) plus the
  # cluster ID its resolvers read with.
  Cluster:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.Cluster
    fields:
      # Both are separate beehive reads, kept off the record and run only when
      # selected: event chatter must not ride the cluster watch, and the owned
      # caches stream standalone so cache churn never re-emits a cluster.
      caches:
        resolver: true
      events:
        resolver: true

  ClusterSpec:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterSpec

  ClusterSpecSource:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterSpecSource

  ClusterSpecSourceKubeconfig:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterSpecSourceKubeconfig

  ClusterStatusSource:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterStatusSource

  ClusterStatus:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterStatus

  ClusterServer:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterServer

  ClusterStatusSourceKubeconfig:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterStatusSourceKubeconfig

  ClusterStatusSourceKubeconfigCluster:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterStatusSourceKubeconfigCluster

  ClusterStatusSourceKubeconfigUser:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterStatusSourceKubeconfigUser

  ClusterStatusSourceKubeconfigClusterEntry:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterStatusSourceKubeconfigClusterEntry

  ClusterPrincipal:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterPrincipal
    fields:
      permissions:
        resolver: true

  # The conditions ride the wire as-is (the stored shapes; the webview derives
  # display state from type/status/reason). Unprefixed shared vocabulary: the same
  # Condition rides both the Cluster kind's status and the ClusterCache kind's, so
  # it belongs to no single storage provenance.
  #
  # Condition/Event/Schedule are shared, kind-agnostic vocabulary on the wire but
  # live in `internal/services/cluster` only because it's their sole consumer today. The
  # wire-universal (unprefixed) name and the internal package home are orthogonal:
  # the unprefixed name says "not specific to one wire namespace", not "must live
  # package-neutral". When a non-cluster kind/subsystem first needs conditions,
  # hoist all three together into a shared leaf package (e.g. internal/lib/apimeta),
  # leaving cluster its ConditionType constants (Connected/Identified/Synced) — see
  # sidecar/CLAUDE.md. Until that second consumer exists, a shared package would be
  # a one-importer abstraction, so they stay here.
  Condition:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.Condition

  ObjectRef:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ObjectRef

  # The generic event surface. Event binds 1:1 to the Go type; its run id
  # rides the shared ObjectID scalar (no dedicated Event id scalar), and EventType
  # binds straight to beehive.EventType (values Normal/Warning match), the same
  # external-enum pattern as ConditionStatus.
  Event:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.Event

  # The event watches' envelope. Its own two-value enum rather than CollectionWatchFrameType: the
  # log is append-only, so Added/Modified/Deleted would advertise transitions that
  # can never arrive.
  EventFeedFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.EventFeedFrame

  EventFeedFrameType:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.EventFeedFrameType

  EventType:
    model: github.com/amorey/beehive.EventType

  # The generic reconcile-schedule state watch (next-requeue countdown), decoupled from
  # the cluster/list watch. Binds 1:1 to the Go type.
  Schedule:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.Schedule

  ConditionStatus:
    model: github.com/amorey/beehive.ConditionStatus

  # The collection watches. CollectionWatchFrameType binds to the shared internal/lib/apimeta type — more
  # than one service streams delta frames, and gqlgen binds one enum to one Go type, so
  # a per-service definition would make every frame wrapper's `type` field a resolver.
  # The frame wrappers bind 1:1 to the types the watch pumps emit.
  CollectionWatchFrameType:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/lib/apimeta.CollectionWatchFrameType

  ClusterCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCollectionWatchFrame

  ClusterDataRateSampleFeedFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterDataRateSampleFeedFrame

  ClusterDataRateSample:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterDataRateSample

  ClusterCacheCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheCollectionWatchFrame

  ClusterCache:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCache
    fields:
      # kinds and events are separate reads (the cache's SQLite catalog, the beehive
      # event log), so both stay off the record and run only when selected.
      kinds:
        resolver: true
      cachedKinds:
        resolver: true
      events:
        resolver: true

  # The cache subtree's served spec IS the stored beehive type (no projection layer).
  ClusterCacheSpec:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheSpec
  ClusterCachedKind:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedKind
    fields:
      events:
        resolver: true
  ClusterCachedKindSpec:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedKindSpec
    fields:
      # The wire's positive form over a stored Paused. The storage field is inverted so a
      # record written before it decodes as syncing; this resolver is the one negation.
      syncEnabled:
        resolver: true
  ClusterCachedKindCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedKindCollectionWatchFrame
  ClusterCacheHealth:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheHealth
  UnhealthyKindRef:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.UnhealthyKindRef

  ClusterCacheStats:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheStats

  ClusterCacheSyncState:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheSyncState
  ClusterCacheDiscoveryStatus:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheDiscoveryStatus
  ClusterCacheKindSyncStatus:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCacheKindSyncStatus

  ClusterCachedDataKind:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedDataKind

  ClusterCachedDataKindCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedDataKindCollectionWatchFrame

  # Mapped like every other cached-data type: an unmapped schema type autobinds into
  # graph/model, and cluster would then import it — the layering this block exists to hold.
  PrinterColumn:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.PrinterColumn

  # firstSeen/lastSeen autobind to value time.Time fields: gqlgen's Time marshaler emits null
  # for the zero time, which is exactly the wire's meaning of an absent timestamp.
  ClusterCachedDataEvent:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedDataEvent

  ClusterCachedDataEventCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedDataEventCollectionWatchFrame

  # creationTimestamp autobinds like the event timestamps above. rawJSON autobinds to the
  # RawJSON field too: the body is already read by the time the record exists — the watch
  # fetches one per frame it sends — so gating its marshal behind a resolver would defer
  # nothing.
  ClusterCachedDataObject:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedDataObject

  ClusterCachedDataObjectCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ClusterCachedDataObjectCollectionWatchFrame

  # --- Models ---
  # The dialect a provider speaks, named for the API. Every member binds to its
  # constant, or gqlgen refuses the binding, which is what keeps a new schema value
  # from reaching the wire with nothing behind it. Model and Provider are the
  # catalog's and bind when it lands.
  LLMDialect:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/llm.Dialect
    enum_values:
      Messages:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/llm.DialectMessages
      Responses:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/llm.DialectResponses
      ChatCompletions:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/llm.DialectChatCompletions
      Fake:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/llm.DialectFake

  # --- Chat ---
  # The chat types bind 1:1 into internal/agent/chat, like the cluster ones. ChatID is a
  # UUID string, not a beehive object id, so it is its own scalar; it binds to apimeta,
  # which chat aliases, since memory and tools name a chat too.
  ChatID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/lib/apimeta.ChatID

  MessageID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.MessageID

  ApprovalID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.ApprovalID

  ToolCallID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.ToolCallID

  ToolCall:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.ToolCall
    fields:
      # A provider call has no status; the record keeps "" so a call stays
      # comparable, and the resolver serves it as null.
      status:
        resolver: true

  ToolCallApproval:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.ToolCallApproval
  SandboxAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.SandboxAction
  SandboxRequest:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.SandboxRequest
  ClusterWrite:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.ClusterWrite
  CloudRequest:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.CloudRequest
  RequestDetail:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.Detail
  # principal is "" on a stored action that names none, which the wire
  # serves as null.
  PermissionAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/chat.PermissionAction
    fields:
      principal:
        resolver: true

  # --- Memory ---
  # The memory types bind 1:1 into internal/services/memory, like the chat ones.
  MemoryID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/memory.MemoryID

  Memory:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/memory.Memory

  MemoryCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/memory.MemoryCollectionWatchFrame

  MemoryAuthor:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/memory.Author
    enum_values:
      Model:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/memory.AuthorModel
      User:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/memory.AuthorUser

  # --- Monitoring ---
  # The monitoring types bind 1:1 into internal/agent/monitor, whose records hold
  # each nullable value as a zero value and JSON as the stored string, so they
  # stay comparable: those fields are resolvers. integration and clusterID are
  # resolved through kubesignals, which the core never imports.
  MonitorTargetID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.MonitorTargetID
  IncidentID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentID
  IncidentOccurrenceID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentOccurrenceID

  MonitorTarget:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.MonitorTarget
    fields:
      integration:
        resolver: true
      clusterID:
        resolver: true
      currentUID:
        resolver: true
      unknownSignals:
        resolver: true
  MonitorTargetCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.MonitorTargetCollectionWatchFrame
  MonitorSignal:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.MonitorSignal
    fields:
      integration:
        resolver: true
  Incident:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.Incident
    fields:
      subjectAttributes:
        resolver: true
      lastSeenAt:
        resolver: true
      lastEndReason:
        resolver: true
  IncidentTriage:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentTriage
    fields:
      verdict:
        resolver: true
      error:
        resolver: true
      report:
        resolver: true
      providerID:
        resolver: true
      modelID:
        resolver: true
      effort:
        resolver: true
  IncidentTriageState:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageState
    enum_values:
      None:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageStateNone
      Queued:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageStateQueued
      Done:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageStateDone
      Failed:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageStateFailed
  IncidentTriageVerdict:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageVerdict
    enum_values:
      Attention:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageVerdictAttention
      Dismiss:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageVerdictDismiss
  IncidentTriageError:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageErrorCode
    enum_values:
      MonitoringOff:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeMonitoringOff
      ServerChanged:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeServerChanged
      TargetGone:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeTargetGone
      NoSandbox:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeNoSandbox
      ModelUnavailable:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeModelUnavailable
      RunFailed:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeRunFailed
      Cancelled:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeCancelled
      Interrupted:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeInterrupted
      Unavailable:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.TriageCodeUnavailable
  IncidentCollectionWatchFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentCollectionWatchFrame
  IncidentOccurrence:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentOccurrence
    fields:
      endedAt:
        resolver: true
      endReason:
        resolver: true
      detail:
        resolver: true
  IncidentOccurrenceEventFeedFrame:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentOccurrenceEventFeedFrame
  IncidentOccurrenceEventFeedFrameType:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentOccurrenceEventFeedFrameType
    enum_values:
      Occurrence:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentOccurrenceEventFeedFrameOccurrence
      Bookmark:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.IncidentOccurrenceEventFeedFrameBookmark

  MonitorReadState:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.ReadState
    enum_values:
      NeverRead:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.ReadStateNeverRead
      Ok:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.ReadStateOk
      Partial:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.ReadStatePartial
      Failed:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.ReadStateFailed
  MonitorReadError:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.ReadErrorCode
    enum_values:
      NotReady:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeNotReady
      Disabled:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeDisabled
      Unavailable:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeUnavailable
      PermissionDenied:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodePermissionDenied
      Unauthenticated:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeUnauthenticated
      RateLimited:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeRateLimited
      Unsupported:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeUnsupported
      Truncated:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeTruncated
      Timeout:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeTimeout
      Invalid:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.CodeInvalid
  MonitorSeverity:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.Severity
    enum_values:
      Critical:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.SeverityCritical
      Warning:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.SeverityWarning
      Info:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.SeverityInfo
  IncidentOccurrenceEndReason:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.EndReason
    enum_values:
      Resolved:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.EndResolved
      Stopped:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.EndStopped
      Stale:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/agent/monitor.EndStale

  ToolAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.Action

  CommandAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.CommandAction

  ReadAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.ReadAction

  WriteAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.WriteAction

  EditAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.EditAction

  SearchAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.SearchAction

  FetchAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.FetchAction

  DelegateAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.DelegateAction

  KubeQueryAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.KubeQueryAction

  LogsViewAction:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/tools.LogsViewAction

  LogsViewSource:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.ScopeSource

  LogsViewSourceKind:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.SourceKind
    enum_values:
      Pod:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.SourcePod
      Deployment:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.SourceDeployment
      StatefulSet:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.SourceStatefulSet
      DaemonSet:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.SourceDaemonSet
      Job:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/logs.SourceJob
      CronJob:
