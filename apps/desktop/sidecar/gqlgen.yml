  # --- ChatGPT connector ---
  # The state binds to connectors.State, which holds no token. Email and failure
  # are null outside their phases, so each has a resolver.
  ChatGPTConnection:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.State
    fields:
      email:
        resolver: true
      failure:
        resolver: true

  # --- OpenRouter connector ---
  # The state binds to connectors.State, which holds no key. Failure is null
  # outside Failed, so it has a resolver.
  OpenRouterConnection:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.State
    fields:
      failure:
        resolver: true

  # --- AWS connector ---
  # The state binds to connectors.State, which holds no credential. The ARN is
  # the Subject, and it and the failure are null outside their phases, so each
  # has a resolver.
  AWSConnection:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.State
    fields:
      arn:
        resolver: true
      failure:
        resolver: true

  # --- GitHub connector ---
  # The state binds to connectors.State, which holds no token. Each field but
  # the phase is null outside its own phase, so each has a resolver.
  GitHubConnection:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.State
    fields:
      login:
        resolver: true
      userCode:
        resolver: true
      failure:
        resolver: true

  # --- Google connector ---
  # The state binds to connectors.State, which holds no token. Email and failure
  # are null outside their phases, and the project is the connector's, so each
  # has a resolver.
  GoogleConnection:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.State
    fields:
      email:
        resolver: true
      project:
        resolver: true
      failure:
        resolver: true

  Identity:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/lib/oauth.Identity
    fields:
      sub:
        fieldName: UserID

  # The object-identity scalar binds to the typed int64 ObjectID (its
  # MarshalGQL/UnmarshalGQL handle the decimal-string wire form), so resolver
  # arguments arrive already typed — no per-resolver parsing. ClusterID (and
  # future per-kind ids) are aliases of this one type, sharing its machinery.
  ObjectID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/lib/apimeta.ObjectID

  # A cluster's id is text — its clusters row id — bound to its own type so a resolver
  # cannot take one where an object id belongs.
  ClusterID:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/lib/apimeta.ClusterID

  # The JSON scalar binds to rawjson.RawJSON — a comparable string carrying already-
  # serialized JSON, marshaled verbatim. Its own package because gqlgen binds one scalar
  # to one Go type and more than one service serves a JSON field.
  JSON:
    model: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/lib/rawjson.RawJSON

  # --- gqlgen ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - k8s.io/apimachinery/pkg/types.UID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32

  String:
    model:
      - github.com/99designs/gqlgen/graphql.String
      - github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/cluster.ConditionType
