        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.ScopeNotGranted
      AccountMismatch:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.AccountMismatch
      TimedOut:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.TimedOut
      Unavailable:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.Unavailable
      Refused:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.Refused
      NotSaved:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.NotSaved
      NotDeleted:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.NotDeleted
      SessionEnded:
        value: github.com/kubetail-org/kubetail/apps/desktop/sidecar/internal/services/connectors.SessionEnded
