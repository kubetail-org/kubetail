name: publish-alpine

permissions:
  contents: read

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  config:
    name: Configure workflow
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.config.outputs.version }}
      dry_run: ${{ steps.config.outputs.dry_run }}
    steps:
      - id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

  update-kubetail:
    name: Update `kubetail` package
    needs: [config]
    environment: production
    runs-on: ubuntu-24.04
    env:
      ARCHIVE_NAME: "kubetail-${{ needs.config.outputs.version }}-vendored.tar.gz"
      VERSION: ${{ needs.config.outputs.version }}
    steps:
      - name: Set up Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Install GitLab CLI
        run: |
          brew install glab

      - name: Download source bundle
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: kubetail-org/kubetail
          tag: ${{ format('cli/v{0}', needs.config.outputs.version) }}
          fileName: ${{ env.ARCHIVE_NAME }}
          out-file-path: "downloads"

      - name: Extract metadata
        id: meta
        working-directory: ./downloads
        run: |
          SHA512=$(sha512sum "$ARCHIVE_NAME" | awk '{print $1}')
          echo "sha512=$SHA512" >> "$GITHUB_OUTPUT"

      - name: Load Alpine SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ANDRES_ALPINE_SSH_PRIVATE_KEY }}

      - name: Checkout aports repo
        env:
          KNOWN_HOSTS: ${{ vars.ALPINE_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          git clone --depth 1 git@gitlab.alpinelinux.org:alpine/aports.git

      - name: Checkout kubetail repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-config/alpine
          sparse-checkout-cone-mode: false
          path: kubetail

      - name: Generate APKBUILD
        env:
          SRC_DIR: kubetail/.github/ci-config/alpine
          DST_DIR: aports/testing/kubetail
          SHA512: ${{ steps.meta.outputs.sha512 }}
        run: |
          envsubst '${VERSION} ${SHA512}' \
            < "$SRC_DIR/APKBUILD" \
            > "$DST_DIR/APKBUILD"

      - name: Start gpg-agent
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          if ! grep -q "allow-preset-passphrase" ~/.gnupg/gpg-agent.conf 2>/dev/null; then
            echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          fi
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent

      - name: Configure gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.ANDRES_GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.ANDRES_GPG_PASSWORD }}
          fingerprint: ${{ vars.ANDRES_GPG_SIGNING_KEY_FINGERPRINT }}

      - name: Configure git
        working-directory: aports
        env:
          SIGNING_KEY: ${{ vars.ANDRES_GPG_SIGNING_KEY_FINGERPRINT }}
        run: |
          git config gpg.program gpg
          git config commit.gpgsign true

          git config user.name "Andres Morey"
          git config user.email "andres@kubetail.com"
          git config user.signingkey "$SIGNING_KEY"

      - name: Debug
        if: ${{ needs.config.outputs.dry_run == 'true' }}
        working-directory: aports/testing/kubetail
        run: |
          echo "=== APKBUILD ==="
          cat APKBUILD

      - name: Push changes to aports fork
        if: ${{ needs.config.outputs.dry_run != 'true' }}
        working-directory: aports
        env:
          BRANCH_NAME: "upgrade/kubetail-${{ needs.config.outputs.version }}"
        run: |
          # Create and checkout feature branch
          git checkout -b "$BRANCH_NAME"

          # Stage changes
          git add testing/kubetail/APKBUILD

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Add fork
          git remote add fork git@gitlab.alpinelinux.org:amorey/aports.git

          # Unshallow clone so push is accepted by GitLab
          git fetch --unshallow origin

          # Commit and push
          git commit -s -S -m "testing/kubetail: upgrade to $VERSION"
          git push --set-upstream fork "$BRANCH_NAME"

      - name: Create merge request
        if: ${{ needs.config.outputs.dry_run != 'true' }}
        working-directory: aports
        env:
          GITLAB_TOKEN: ${{ secrets.ANDRES_ALPINE_GITLAB_TOKEN }}
          GITLAB_HOST: gitlab.alpinelinux.org
          BRANCH_NAME: "upgrade/kubetail-${{ needs.config.outputs.version }}"
        run: |
          glab mr create \
            --repo alpine/aports \
            --target-branch master \
            --title "testing/kubetail: upgrade to $VERSION" \
            --description "https://github.com/kubetail-org/kubetail Real-time logging dashboard for Kubernetes" \
            --remove-source-branch \
            --yes

      - name: Cleanup GPG
        if: always()
        run: rm -rf ~/.gnupg
