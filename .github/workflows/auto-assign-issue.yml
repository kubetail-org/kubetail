name: Auto assign/unassign issues

permissions:
  contents: read
  issues: write

on:
  issue_comment:
    types: [created]

jobs:
  execute:
    if: github.repository == 'kubetail-org/kubetail'
    runs-on: ubuntu-slim
    steps:
      - uses: cncf/prow-github-actions@a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
        with:
          prow-commands: /assign /unassign
          github-token: '${{ secrets.GITHUB_TOKEN }}'
