name: Auto assign/unassign issues

permissions:
  contents: read
  issues: write

on:
  issue_comment:
    types: [created]

jobs:
  execute:
    runs-on: ubuntu-slim
    steps:
      - uses: jpmcb/prow-github-actions@c44ac3a57d67639e39e4a4988b52049ef45b80dd # v2.0.0
        with:
          prow-commands: /assign /unassign 
          github-token: '${{ secrets.GITHUB_TOKEN }}'
