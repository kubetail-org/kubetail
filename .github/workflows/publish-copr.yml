name: publish-copr

permissions:
  contents: read

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          pip3 install --user copr-cli

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-config/copr
          sparse-checkout-cone-mode: false
          path: kubetail

      - name: Configure copr-cli
        env:
          COPR_LOGIN: ${{ vars.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = $COPR_LOGIN
          username = kubetail
          token = $COPR_TOKEN
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Execute templates
        env:
          VERSION: ${{ steps.config.outputs.version }}
          SRC_DIR: kubetail/.github/ci-config/copr
        run: |
          export TIMESTAMP=$(LANG=C date '+%a %b %e %Y')

          # .spec
          envsubst '${VERSION} ${TIMESTAMP}' \
            < "${SRC_DIR}/kubetail.spec.tmpl" \
            > "kubetail.spec"

      - name: Publish to copr
        env:
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            copr-cli build --nowait kubetail ./kubetail.spec
          else
            cat kubetail.spec
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.config/copr
