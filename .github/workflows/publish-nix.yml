name: publish-nix

permissions:
  contents: read

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  trigger-release-workflow:
    name: Trigger release workflow in kubetail-org/kubetail-nix repo
    environment: production
    runs-on: ubuntu-slim
    steps:
      - name: Config
        id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Get kubetail-actions app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KUBETAIL_ACTIONS_APP_ID }}
          private-key: ${{ secrets.KUBETAIL_ACTIONS_APP_PRIVATE_KEY }}
          owner: kubetail-org
          repositories: kubetail-nix
          permission-actions: write

      - name: Trigger workflow
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          repo: kubetail-org/kubetail-nix
          workflow: release
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          inputs: '{ "version": "${{ steps.config.outputs.version }}", "dry_run": ${{ steps.config.outputs.dry_run }} }'
