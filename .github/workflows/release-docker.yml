name: release-docker

permissions:
  contents: read

on:
  push:
    tags:
      - "dashboard/v*"
      - "cluster-api/v*"
      - "cluster-agent/v*"
      - "cli/v*"
  workflow_dispatch:
    inputs:
      git_tag:
        description: "Git tag"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  config:
    name: Configure workflow
    runs-on: ubuntu-slim
    outputs:
      git_sha: ${{ steps.config.outputs.git_sha }}
      component: ${{ steps.config.outputs.component }}
      image_name: ${{ steps.config.outputs.image_name }}
      base_image_tag: ${{ steps.config.outputs.base_image_tag }}
      dry_run: ${{ steps.config.outputs.dry_run }}
      is_latest: ${{ steps.tag_meta.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-release-tag.sh
          sparse-checkout-cone-mode: false

      - id: config
        env:
          INPUT_GIT_TAG: ${{ github.event.inputs.git_tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            GIT_TAG="$INPUT_GIT_TAG"
            DRY_RUN="$INPUT_DRY_RUN"
          else
            GIT_TAG="${GITHUB_REF#refs/tags/}"
            DRY_RUN=false
          fi

          bash scripts/check-release-tag.sh "$GIT_TAG"

          # A dispatch can name a tag that does not exist. git/ref matches the
          # name exactly; the commits API peels an annotated tag to its commit.
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GIT_TAG}" --silent
          GIT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${GIT_TAG}" --jq .sha)

          COMPONENT=${GIT_TAG%%/*}
          BASE_IMAGE_TAG=${GIT_TAG#*/v}

          echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT
          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "image_name=kubetail-$COMPONENT" >> $GITHUB_OUTPUT
          echo "base_image_tag=$BASE_IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT

      - id: tag_meta
        env:
          COMPONENT: ${{ steps.config.outputs.component }}
          CURRENT_VERSION: ${{ steps.config.outputs.base_image_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if *current* tag is stable
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            echo "Current version ($CURRENT_VERSION) is a pre-release and will not be treated as latest."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch all tags and filter by component
          TAGS=$(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq ".[] | select(.name | startswith(\"$COMPONENT/v\")) | .name")

          # Extract version part (after '<prefix>/v') and drop anything with '-'
          STABLE_VERSIONS=$(printf '%s\n' "$TAGS" \
            | sed -n "s|^${COMPONENT}/v||p" \
            | grep -v -- '-' || true)

          # Sort versions and take the highest (latest)
          LATEST_VERSION=$(printf '%s\n' "$STABLE_VERSIONS" | sort -V | tail -n 1)

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "Current version ($CURRENT_VERSION) is latest."
            echo "is_latest=true"  >> "$GITHUB_OUTPUT"
          else
            echo "Current version ($CURRENT_VERSION) is not latest."
            echo "is_latest=false"  >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: [config]
    environment: production
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        variant:
          - ""
          - "-alpine"
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag's commit, so a branch of the same name is never built.
          ref: ${{ needs.config.outputs.git_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define build variables
        id: vars
        env:
          BASE_IMAGE_TAG: ${{ needs.config.outputs.base_image_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          IMAGE_TAG="${BASE_IMAGE_TAG}${VARIANT}"
          if [ "$VARIANT" == "-alpine" ]; then
            DOCKER_TARGET="final-alpine"
          else
            DOCKER_TARGET="final"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "docker_target=$DOCKER_TARGET" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/Dockerfile.${{ needs.config.outputs.component }}
          push: ${{ needs.config.outputs.dry_run == 'false' }}
          target: ${{ steps.vars.outputs.docker_target }}
          # Only Dockerfile.cli declares VERSION; the others ignore it.
          build-args: VERSION=${{ needs.config.outputs.base_image_tag }}
          # An SPDX SBOM attestation, which imagetools create carries into
          # the multi-arch manifest.
          sbom: true
          tags: |
            kubetail/${{ needs.config.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ needs.config.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}-${{ matrix.arch }}

      # The manifest job assembles the index from these digests, so a tag
      # moved after this push cannot change what the release holds.
      - name: Export digest
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir digests
          echo "$DIGEST" > "digests/${ARCH}${VARIANT}"

      - name: Upload digest
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}${{ matrix.variant }}
          path: digests
          if-no-files-found: error
          retention-days: 1

  create-and-publish-manifest:
    environment: production
    runs-on: ubuntu-24.04
    needs: [config, build-and-publish]
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and build provenance.
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        variant:
          - ""
          - "-alpine"
    steps:
      - name: Setup jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define manifest variables
        id: vars
        env:
          BASE_IMAGE_TAG: ${{ needs.config.outputs.base_image_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          IMAGE_TAG="${BASE_IMAGE_TAG}${VARIANT}"
          if [ "$VARIANT" == "-alpine" ]; then
            LATEST_TAG="latest-alpine"
          else
            LATEST_TAG="latest"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Download digests
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Create and push versioned manifests
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          AMD64_DIGEST=$(cat "digests/amd64${VARIANT}")
          ARM64_DIGEST=$(cat "digests/arm64${VARIANT}")
          for DIGEST in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest: $DIGEST"
              exit 1
            fi
          done

          # build-push-action pushes the same manifest to both registries, so
          # each digest names the same image in each.
          for REPO in "kubetail/$IMAGE_NAME" "ghcr.io/$GITHUB_REPOSITORY_OWNER/$IMAGE_NAME"; do
            docker buildx imagetools create -t "$REPO:$IMAGE_TAG" \
              "$REPO@$AMD64_DIGEST" \
              "$REPO@$ARM64_DIGEST"
          done

      - name: Delete extra arch manifests
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          # The JWT stays in this step's shell: GITHUB_ENV would hand it to every later step.
          BODY=$(jq -n --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" '{$username, $password}')
          TOKEN=$(curl -sS --fail-with-body -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" -d "$BODY" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Docker Hub login returned no token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          declare -a tags=("${IMAGE_TAG}-amd64" "${IMAGE_TAG}-arm64")
          for tag in "${tags[@]}"
          do
            RESPONSE=$(curl -s -w "%{http_code}" \
              -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/kubetail/${IMAGE_NAME}/tags/$tag")
            if [ "$RESPONSE" -ne 204 ]; then
              echo "DELETE for $tag failed with status $RESPONSE"
              exit 1
            fi
          done

      - name: Get image digest
        id: digest
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          DIGEST=$(docker buildx imagetools inspect kubetail/$IMAGE_NAME:$IMAGE_TAG \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign Docker Hub image
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign \
            --yes \
            -r \
            kubetail/$IMAGE_NAME@$DIGEST

      - name: Sign GHCR image
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign \
            --yes \
            -r \
            ghcr.io/$GITHUB_REPOSITORY_OWNER/$IMAGE_NAME@$DIGEST

      - name: Attest Docker Hub image
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/kubetail/${{ needs.config.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest GHCR image
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ needs.config.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Last, so latest only ever names a signed, attested index. With a single source,
      # imagetools create copies the index unchanged, so the versioned
      # signature covers latest too.
      - name: Move latest
        if: ${{ needs.config.outputs.dry_run == 'false' && needs.config.outputs.is_latest == 'true' }}
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          LATEST_TAG: ${{ steps.vars.outputs.latest_tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          for REPO in "kubetail/$IMAGE_NAME" "ghcr.io/$GITHUB_REPOSITORY_OWNER/$IMAGE_NAME"; do
            docker buildx imagetools create -t "$REPO:$LATEST_TAG" "$REPO@$DIGEST"
          done
