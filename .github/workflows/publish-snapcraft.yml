name: publish-snapcraft

permissions:
  contents: read

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy"
        required: true
        type: string
      release:
        description: "Release channel (e.g. stable, edge)"
        required: true
        type: string
        default: "stable"
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  build-and-publish:
    name: Build and publish
    environment: production
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Configure
        id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "release=$INPUT_RELEASE" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "release=stable" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci-config/snapcraft.yaml.tmpl
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Execute snapcraft templates
        env:
          TMPL_VERSION: ${{ steps.config.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          envsubst '${TMPL_VERSION}' \
            < ".github/ci-config/snapcraft.yaml.tmpl" \
            > "snapcraft.yaml"

      - name: Install Snapcraft and LXD
        run: |
          set -euo pipefail
          sudo snap install --classic snapcraft
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          # Docker's FORWARD DROP policy cuts the LXD build container off the network.
          sudo iptables -P FORWARD ACCEPT

      # sudo -u starts a session that has the lxd group added above.
      - name: Build
        env:
          SNAPCRAFT_BUILD_INFO: '1'
        run: |
          sudo -u "$USER" -E snapcraft --use-lxd

      - name: Publish
        if: ${{ steps.config.outputs.dry_run != 'true' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          RELEASE: ${{ steps.config.outputs.release }}
        run: |
          snapcraft upload ./*.snap --release "$RELEASE"
