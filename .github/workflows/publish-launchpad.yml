name: publish-launchpad

permissions:
  contents: read

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
      series:
        description: "Ubuntu series to publish"
        required: false
        type: string
        default: "jammy noble questing resolute"
      debian_revision:
        description: "Debian revision number"
        required: false
        type: string
        default: "1"
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SERIES: ${{ github.event.inputs.series }}
          INPUT_DEBIAN_REVISION: ${{ github.event.inputs.debian_revision }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
            echo "series=$INPUT_SERIES" >> $GITHUB_OUTPUT
            echo "debian_revision=$INPUT_DEBIAN_REVISION" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "series=jammy noble questing resolute" >> $GITHUB_OUTPUT
            echo "debian_revision=1" >> $GITHUB_OUTPUT
          fi

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci-config/launchpad
          sparse-checkout-cone-mode: false
          path: kubetail
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper-compat

      - name: Download vendored source bundle
        uses: robinraju/release-downloader@daf26c55d821e836577a15f77d86ddc078948b05 # v1.12
        with:
          repository: kubetail-org/kubetail
          tag: ${{ format('cli/v{0}', steps.config.outputs.version) }}
          fileName: "kubetail-${{ steps.config.outputs.version }}-vendored.tar.gz"
          out-file-path: "work"

      - name: Prepare orig bundle
        working-directory: work
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          tar -xzf "kubetail-${VERSION}-vendored.tar.gz"
          rm -rf "kubetail-${VERSION}-vendored.tar.gz"
          mv kubetail-${VERSION} "kubetail-cli-${VERSION}"
          tar -cJf "kubetail-cli_${VERSION}.orig.tar.xz" "kubetail-cli-${VERSION}"

      - name: Create debian directory
        env:
          VERSION: ${{ steps.config.outputs.version }}
          SRC_DIR: kubetail/.github/ci-config/launchpad
          DST_DIR: work/kubetail-cli-${{ steps.config.outputs.version }}/debian
        run: |
          mkdir -p "${DST_DIR}/source"

          export TIMESTAMP="$(date -Ru)"

          # copyright
          cp "${SRC_DIR}/copyright" "${DST_DIR}/copyright"

          # rules
          envsubst '${VERSION}' \
            < "${SRC_DIR}/rules.tmpl" \
            > "${DST_DIR}/rules"

          # source/format
          cp "${SRC_DIR}/source/format" "${DST_DIR}/source/format"

          # source/options
          cp "${SRC_DIR}/source/options" "${DST_DIR}/source/options"

      - name: Configure gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.KUBETAIL_BOT_GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.KUBETAIL_BOT_GPG_PASSWORD }}
          fingerprint: ${{ vars.KUBETAIL_BOT_GPG_SIGNING_KEY_FINGERPRINT }}

      - name: Build and push packages
        working-directory: work/kubetail-cli-${{ steps.config.outputs.version }}
        env:
          VERSION: ${{ steps.config.outputs.version }}
          SRC_DIR: ../../kubetail/.github/ci-config/launchpad
          DEBFULLNAME: ${{ vars.KUBETAIL_BOT_NAME}}
          DEBEMAIL: ${{ vars.KUBETAIL_BOT_EMAIL }}
          SERIES_LIST: ${{ steps.config.outputs.series }}
          DEBIAN_REVISION: ${{ steps.config.outputs.debian_revision }}
          GPG_FINGERPRINT: ${{ vars.KUBETAIL_BOT_GPG_SIGNING_KEY_FINGERPRINT }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
        run: |
          for SERIES in $SERIES_LIST; do
            export PKG_VERSION="${VERSION}-${DEBIAN_REVISION}~${SERIES}1"

            # Restrict architectures for noble and jammy
            case "${SERIES}" in
              noble|jammy) export ARCHITECTURES="amd64 arm64 armhf" ;;
              *)           export ARCHITECTURES="any" ;;
            esac

            envsubst '${ARCHITECTURES}' \
              < "${SRC_DIR}/control.tmpl" \
              > debian/control

            # Fresh single-entry changelog per series (each is an independent
            # -sa upload). rm makes --create idempotent across iterations.
            rm -f debian/changelog

            # -sa for every series: each series is a self-contained source
            # upload sharing one orig tarball; re-sends are de-duplicated.
            dch --create --package kubetail-cli -D "${SERIES}" -v "${PKG_VERSION}" "Initial release for ${SERIES}."
            debuild -sa -S -d -k"$GPG_FINGERPRINT"

            if [ "$DRY_RUN" = "false" ]; then
              dput ppa:kubetail/kubetail "../kubetail-cli_${PKG_VERSION}_source.changes"
            else
              cat debian/control
              cat debian/changelog
              cat "../kubetail-cli_${PKG_VERSION}_source.changes"
            fi
          done

      - name: Cleanup GPG
        if: always()
        run: rm -rf ~/.gnupg
