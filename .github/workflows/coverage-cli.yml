name: coverage-cli

# The CLI's and the Dashboard's coverage. Every test binary counts both
# modules' packages, so a Dashboard line the CLI's tests reach is covered.
# libs/go-common is measured in coverage-libs.yml.

permissions:
  contents: read

# coverage.yml calls this; a dispatch runs it alone.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Picks the jobs to run. Each line of `jobs` is a group of jobs and the
  # path-filters.yml keys that run it: on a pull request, when a path under one
  # of them changed; on any other event, always. The keys are
  # ci-cli.yml's, so a path that runs the area's tests measures their coverage.
  #
  # Every other job needs this one, so its `if:` gates the whole workflow:
  # GitHub starts push runs in forks too, and a fork runs this only for a pull
  # request or a dispatch.
  plan:
    name: Plan
    if: >-
      github.repository == 'kubetail-org/kubetail'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ fromJSON(steps.plan.outputs.jobs).go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: plan
        uses: ./.github/actions/plan
        with:
          jobs: |
            go: shared cli dashboard go-common graphql-dashboard

  # One runner per OS: the platform splits in the Go code are by OS, none by
  # architecture. scripts/cover-changed.sh measures as this job does; change
  # both together.
  cli-coverage:
    name: Go (${{ matrix.goos }})
    needs: plan
    if: needs.plan.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            runner: ubuntu-24.04
          - goos: darwin
            runner: macos-15
          - goos: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      # Codecov's upload authenticates with an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # Bash, since PowerShell splits -coverpkg=... at its dot.
      - name: Measure coverage
        shell: bash
        run: >-
          go test -timeout 20m -covermode=atomic
          -coverpkg=github.com/kubetail-org/kubetail/cli/...,github.com/kubetail-org/kubetail/dashboard/...
          -coverprofile="$RUNNER_TEMP/go.out"
          ./cli/... ./dashboard/...
      - name: Merge the profile's blocks and drop marked lines
        working-directory: ./tools
        shell: bash
        run: go run ./coverignore -dir .. -o "$RUNNER_TEMP/cli-${{ matrix.goos }}.out" "$RUNNER_TEMP/go.out"
      # A fork's PR cannot mint the OIDC token; the action then uploads
      # tokenless, which Codecov accepts for a public repository.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/cli-${{ matrix.goos }}.out
          disable_search: true
          plugins: noop
          flags: cli-${{ matrix.goos }}
          fail_ci_if_error: true

  # Reads the cli component of Codecov's merged result once this run's
  # uploads are processed, and fails on an uncovered changed line or a drop in
  # the component's total (tools/coveragegate).
  gate:
    name: Gate
    needs:
      - plan
      - cli-coverage
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The gate diffs the base and the head itself, so it needs their history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Gate on Codecov's merged result
        working-directory: ./tools
        env:
          # The uploads to wait for. None after a failed coverage job, which
          # coverage.yml's Coverage · Passed fails on.
          FLAGS: ${{ needs.cli-coverage.result == 'success' && 'cli-linux,cli-darwin,cli-windows' || '' }}
          # Codecov records a PR's uploads under its head, not the merge commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Empty on a push, whose base is the commit's parent.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          go run ./coveragegate -component cli -sha "$SHA" -base "$BASE" -flags "$FLAGS"
          -run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
