name: stress-desktop

# Runs the desktop sidecar's tests as stress-cli.yml runs the CLI's: the
# sidecar is a module outside go.work, tested on the desktop's runners.
# stress.yml calls this nightly; a dispatch runs it alone.
# A red run means a concurrency bug was found and nothing else.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      count:
        description: Repetitions of each test (-count)
        type: string
        default: "3"
      cpu:
        description: GOMAXPROCS values to run each test under (-cpu), as a JSON array
        type: string
        default: "[1,4]"
  workflow_dispatch:
    inputs:
      count:
        description: Repetitions of each test (-count)
        default: "3"
      cpu:
        description: GOMAXPROCS values to run each test under (-cpu), as a JSON array
        default: "[1,4]"

env:
  COUNT: ${{ inputs.count || '3' }}

jobs:
  # GitHub starts stress.yml's scheduled runs in forks too, and a called
  # workflow sees the caller's event. Outside kubetail-org/kubetail this job
  # runs only for a dispatch, and every other job needs it, so a fork's
  # scheduled run skips whole.
  plan:
    name: Plan
    if: >-
      github.repository == 'kubetail-org/kubetail'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    steps:
      - run: "true"

  stress:
    # report-stress.yml rebuilds STRESS_ID from the name.
    name: Test (${{ matrix.runner }}, ${{ matrix.race && 'race' || 'norace' }}, cpu ${{ matrix.cpu }})
    needs: plan
    strategy:
      fail-fast: false
      # Keep in step with runners.json's desktop set.
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - macos-27
          - windows
        arch:
          - amd64
          - arm64
        race:
          - true
          - false
        # A JSON array, since an expression cannot split a list.
        cpu: ${{ fromJSON(inputs.cpu || '[1,4]') }}
        exclude:
          # The macOS 27 image is Apple silicon alone.
          - os: macos-27
            arch: amd64
          # The race detector does not support windows/arm64.
          - os: windows
            arch: arm64
            race: true
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: amd64
            runner: macos-26-intel
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: macos-27
            arch: arm64
            runner: xcode-27
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CPU: ${{ matrix.cpu }}
      RACE: ${{ matrix.race }}
      STRESS_ID: desktop-${{ matrix.runner }}-${{ matrix.race && 'race' || 'norace' }}-cpu${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          # ci-desktop.yml's Build and Test · Go cache, restored to skip
          # compiling what that job built. This job never saves one: its flags
          # differ from a PR's.
          go-cache-key: desktop-sidecar-test-${{ matrix.os }}-${{ matrix.arch }}
      # -timeout sits under timeout-minutes, so a hang fails the test binary
      # with a goroutine dump rather than the runner killing the job.
      # Each package's result goes to the log as it lands, so a job that dies
      # before its report still shows which package was running. The
      # sidecar's tests read SSH_AUTH_SOCK, as in make test-desktop.
      - name: Run tests under stress
        shell: bash
        env:
          SSH_AUTH_SOCK: ""
        run: |
          race_flag=""
          if [ "$RACE" = true ]; then
            race_flag=-race
          fi
          mkdir -p stress
          status=0
          go -C apps/desktop/sidecar test $race_flag -cpu "$CPU" -shuffle=on -count="$COUNT" -timeout 90m -json ./... \
            | tee stress/stress.json \
            | jq -rR --unbuffered 'fromjson? | select(.Test == null and (.Action == "pass" or .Action == "fail"))
                | "\(.Action) \(.Package) \(.Elapsed)s"' \
            || status=$?
          go run ./scripts/stress.go -cpu "$CPU" -count "$COUNT" -race="$RACE" \
            -runner "$STRESS_ID" stress/stress.json
          exit "$status"
      # On a cancel, too: timeout-minutes cancels the job, and the partial
      # stress.json is all that says where it stopped.
      - name: Upload failures
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-${{ env.STRESS_ID }}
          path: stress/
          retention-days: 14

  report:
    name: report
    needs: stress
    if: failure()
    uses: ./.github/workflows/report-stress.yml
    with:
      stress-id-prefix: desktop-
      labels: testing,lang/go,desktop
      outside-title: Desktop stress run failed outside a test
    permissions:
      actions: read
      issues: write
