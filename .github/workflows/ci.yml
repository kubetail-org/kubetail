name: ci

# The one CI run of a pull request or a push to main. Each area's jobs are in
# a workflow of their own, ci-<area>.yml, which this one calls. Its last job,
# CI · Passed, is the one check the ruleset requires.
#
# Each area's Plan job skips the jobs whose paths a pull request did not touch.
# Job ids are unique across the ci-*.yml files, since cache keys hold them.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the caches, save none. update: also save new ones.
          rebuild: start the Go caches from empty and save them. Off main, a
          saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Pushes to main share a group that never
# cancels a running run, which would save no cache: a newer push replaces only
# the run still waiting. Every other run has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every area takes the same permissions: its Plan reads the pull request's
  # files (pull-requests: read), and its Prune · Caches deletes caches
  # (actions: write).
  cli:
    name: cli
    uses: ./.github/workflows/ci-cli.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  libs:
    name: libs
    uses: ./.github/workflows/ci-libs.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  cluster:
    name: cluster
    uses: ./.github/workflows/ci-cluster.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  web:
    name: web
    uses: ./.github/workflows/ci-web.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  e2e:
    name: e2e
    uses: ./.github/workflows/ci-e2e.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  repo:
    name: repo
    uses: ./.github/workflows/ci-repo.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  # The required check. An area whose Plan skipped every job counts as passed.
  passed:
    name: CI · Passed
    needs:
      - cli
      - libs
      - cluster
      - web
      - e2e
      - repo
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check each area passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
