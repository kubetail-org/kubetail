name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the caches, save none. update: also save new ones.
          rebuild: start the Go caches from empty and save them. Off main, a
          saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Every other run has a group of its own,
# so a run on main is never cancelled, which would save no cache.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # use, update or rebuild: the one place that decides whether a run saves a
  # cache. An update or a rebuild saves a new Go cache per job and runner, and
  # Caches · Prune deletes the one it replaces. A dispatch takes its input; a
  # push to main updates; a PR uses, since every PR saving its own copy pushes
  # the repo past its cache limit.
  CACHE_MODE: ${{ inputs.cache-mode || github.ref == 'refs/heads/main' && 'update' || 'use' }}
  # Full debug info swells the Rust caches and slows linking; line tables keep
  # file:line in test backtraces. Workflow-wide, since rust-cache keys on
  # CARGO_* variables.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # GitHub starts push runs in forks too. Outside kubetail-org/kubetail this job
  # runs only for a PR or a dispatch, and Changes needs it, so a fork's
  # automatic run skips whole.
  fork-gate:
    name: Fork gate
    if: >-
      github.repository == 'kubetail-org/kubetail'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    steps:
      - run: "true"

  # A pull request runs a group's jobs only when a path in its filter changed.
  # A push or a dispatch runs them all, so main catches what a filter misses.
  # Test and build jobs need only this job, so they start beside lint and vet.
  changes:
    name: Changes
    needs: fork-gate
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      cache-mode: ${{ env.CACHE_MODE }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      any: >-
        ${{ github.event_name != 'pull_request'
        || steps.filter.outputs.go == 'true'
        || steps.filter.outputs.rust == 'true'
        || steps.filter.outputs.typescript == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
      yaml: ${{ github.event_name != 'pull_request' || steps.filter.outputs.yaml == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/ci-config/path-filters.yml

  ##############################
  # Lint and vet jobs
  ##############################

  go-lint:
    name: Go · Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - cli
          - cluster-api
          - dashboard
          - shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run linter for ${{ matrix.module }}
        working-directory: ./modules/${{ matrix.module }}
        run: test -z "$(gofmt -l .)"

  # Every module in one job, so the modules share one cache.
  go-vet:
    name: Go · Vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Vet
        working-directory: ./modules
        run: go vet ./cli/... ./cluster-api/... ./dashboard/... ./shared/...
      # Last, so a failed job leaves the last good cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  rust-lint:
    name: Rust · Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-protoc: "true"
      - name: Run format check
        working-directory: ./crates
        run: cargo fmt --all -- --check

  rust-vet:
    name: Rust · Vet
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-protoc: "true"
          rust-cache-key: ${{ github.job }}-ubuntu-24.04
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - name: Run clippy
        working-directory: ./crates
        run: cargo clippy --all -- -D warnings

  typescript-lint:
    name: TypeScript · Lint
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
      - name: Install dependencies
        working-directory: ./dashboard-ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ./dashboard-ui
        run: pnpm lint

  shell-lint:
    name: Shell · Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/install.sh scripts/writing-standards-hook.sh

  python-lint:
    name: Python · Lint
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: ${{ env.CACHE_MODE != 'use' }}
      - name: Lint
        working-directory: ./e2e
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  yaml-lint:
    name: YAML · Lint
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The token turns on zizmor's online audits, which check each pin's
      # commit and version comment against the action's repository.
      - name: Run yamllint, actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-yaml

  ###########################
  # Test jobs
  ###########################

  # Every module in one job per runner, so the modules share one cache.
  go-test:
    name: Go · Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - windows
        arch:
          - amd64
          - arm64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
        exclude:
          - os: macos-26
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Run tests
        working-directory: ./modules
        run: go test ./cli/... ./cluster-api/... ./dashboard/... ./shared/...
      - name: Run race tests
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        working-directory: ./modules
        run: go test -race ./cli/... ./cluster-api/... ./dashboard/... ./shared/...
      # After every test passed, so a failed job leaves its runner's last cache
      # the newest. The test flags must match a PR's, or a PR replays nothing.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  rust-test:
    name: Rust · Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        arch:
          - amd64
          - arm64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-protoc: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - name: Run tests
        working-directory: ./crates
        run: cargo test

  typescript-test:
    name: TypeScript · Test
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
      - name: Install dependencies
        working-directory: ./dashboard-ui
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: ./dashboard-ui
        run: pnpm test run

  shell-test:
    name: Shell · Test
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - windows
        arch:
          - amd64
          - arm64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
        exclude:
          - os: macos-26
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Install bats (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm install -g bats@1.13.0
      - name: Run bats
        shell: bash
        run: bats scripts/

  ###########################
  # Build jobs
  ###########################

  rust-build:
    name: Rust · Build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        arch:
          - amd64
          - arm64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-protoc: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - name: Build
        working-directory: ./crates
        run: cargo build --release

  typescript-build:
    name: TypeScript · Build
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
      - name: Install dependencies
        working-directory: ./dashboard-ui
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ./dashboard-ui
        run: pnpm build

  ###########################
  # Downstream jobs
  ###########################

  docker-builds:
    name: Docker · Build
    needs: changes
    if: needs.changes.outputs.any == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component:
          - cli
          - cluster-agent
          - cluster-api
          - dashboard
        arch:
          - amd64
          - arm64
        target:
          - final
          - final-alpine
        include:
          # --- for arches ---
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          # --- for components --
          - component: cli
            dockerfile: build/package/Dockerfile.cli
          - component: cluster-agent
            dockerfile: build/package/Dockerfile.cluster-agent
          - component: cluster-api
            dockerfile: build/package/Dockerfile.cluster-api
          - component: dashboard
            dockerfile: build/package/Dockerfile.dashboard
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          # final and final-alpine build from the same stages, so they share a
          # scope. Each save replaces the scope's index, which keeps those
          # stages either way; a final stage left out is a copy onto a base.
          # e2e/docker-bake.hcl reads the amd64 scopes.
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: >-
            ${{ env.CACHE_MODE != 'use'
            && format('type=gha,mode=max,scope={0}-{1}', matrix.component, matrix.arch)
            || '' }}

  cli-builds:
    name: CLI · Build
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - windows
        arch:
          - amd64
          - arm64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            platform: linux-amd64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
            platform: macos-amd64
          - os: macos-15
            arch: arm64
            runner: macos-15
            platform: macos-arm64
          - os: macos-26
            arch: arm64
            runner: macos-26
            platform: macos-arm64
          - os: windows
            arch: amd64
            runner: windows-2025
            platform: windows-amd64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            platform: windows-arm64
        exclude:
          - os: macos-26
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
          setup-go: "true"
          go-cache-key: go-test-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Build
        run: make build
        env:
          PLATFORM: ${{ matrix.platform }}

  alpine-builds:
    name: Alpine · Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - armhf
          - armv7
          - loongarch64
          - ppc64le
          - riscv64
          - s390x
        include:
          - arch: x86
            goarch: "386"
          - arch: armhf
            goarch: arm
            goarm: "6"
          - arch: armv7
            goarch: arm
            goarm: "7"
          - arch: loongarch64
            goarch: loong64
          - arch: ppc64le
            goarch: ppc64le
          - arch: riscv64
            goarch: riscv64
          - arch: s390x
            goarch: s390x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads Go · Test's module cache and saves none.
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: go-test-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Setup Alpine
        uses: jirutka/setup-alpine@ae3b3ddba35054804fc4a3507b519fa7e8152050 # v1.4.1
        with:
          arch: ${{ matrix.arch }}
          branch: edge
      - name: Build
        working-directory: ./modules/cli
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -o ../../bin/kubetail .
      - name: Verify
        shell: alpine.sh {0}
        run: |
          set -ex
          ./bin/kubetail serve --test

  e2e:
    name: E2E (k8s ${{ matrix.k8s-version }})
    needs:
      - changes
      - docker-builds
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s-version: "1.21"
            kind-node-image: "kindest/node:v1.21.14"
          - k8s-version: "1.25"
            kind-node-image: "kindest/node:v1.25.16"
          - k8s-version: "latest"
            kind-node-image: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
          setup-go: "true"
          go-cache-key: go-test-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: ${{ env.CACHE_MODE != 'use' }}
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      - name: Run e2e tests
        env:
          KIND_NODE_IMAGE: ${{ matrix.kind-node-image }}
        run: make test-e2e

  ###########################
  # riscv64 jobs, on main only
  ###########################

  # Every module in one job, so the modules share one cache.
  go-test-riscv64:
    name: Go · Test (riscv64)
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04-riscv
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Run tests
        working-directory: ./modules
        run: go test ./cli/... ./cluster-api/... ./dashboard/... ./shared/...
      # Last, so a failed job leaves the last good cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  # Builds the Go binary alone: Node has no riscv64 build to bundle the UI with.
  cli-builds-riscv64:
    name: CLI · Build (riscv64)
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads Go · Test (riscv64)'s cache and saves none.
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: go-test-riscv64-ubuntu-24.04-riscv
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Build
        working-directory: ./modules/cli
        run: CGO_ENABLED=0 go build -ldflags="-s -w" ./main.go

  # The cli and dashboard images build the UI on a node image, which has no
  # riscv64 variant, and Dockerfile.cluster-agent accepts only x86_64 and
  # aarch64.
  docker-builds-riscv64:
    name: Docker · Build (riscv64)
    needs: changes
    if: github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - cluster-api
        target:
          - final
          - final-alpine
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/package/Dockerfile.${{ matrix.component }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}-riscv64
          cache-to: >-
            ${{ env.CACHE_MODE != 'use'
            && format('type=gha,mode=max,scope={0}-riscv64', matrix.component)
            || '' }}

  ###########################
  # Cache jobs
  ###########################

  # A run that saves caches leaves one copy of each on its ref: the newest,
  # which a failed save leaves the last good one. It runs last because
  # rust-cache and setup-node save in post steps, which no later step in their
  # own job can follow.
  cache-prune:
    name: Caches · Prune
    needs:
      - changes
      - go-vet
      - go-test
      - go-test-riscv64
      - rust-vet
      - rust-test
      - rust-build
      - typescript-lint
      - typescript-test
      - typescript-build
      - python-lint
      - cli-builds
      - e2e
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.cache-mode != 'use'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/prune-caches
      - uses: ./.github/actions/prune-caches
