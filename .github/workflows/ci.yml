name: ci

# The one CI run of a pull request or a push to main. Each area's jobs are in
# a workflow of their own, ci-<area>.yml, which this one calls, so an area
# file runs on a pull request only once this one calls it.
#
# Each area's Plan job skips the jobs whose paths a pull request did not touch.
# Job ids are unique across the ci-*.yml files, since cache keys hold them.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the caches, save none. update: also save new ones.
          rebuild: start the Go caches from empty and save them. Off main, a
          saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Pushes to main share a group that never
# cancels a running run, which would save no cache: a newer push replaces only
# the run still waiting. Every other run has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every area takes the same permissions: its Plan reads the pull request's
  # files (pull-requests: read), and its Prune · Caches deletes caches
  # (actions: write).
  cli:
    name: cli
    uses: ./.github/workflows/ci-cli.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  libs:
    name: libs
    uses: ./.github/workflows/ci-libs.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  cluster:
    name: cluster
    uses: ./.github/workflows/ci-cluster.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  web:
    name: web
    uses: ./.github/workflows/ci-web.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  desktop:
    name: desktop
    uses: ./.github/workflows/ci-desktop.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  e2e:
    name: e2e
    uses: ./.github/workflows/ci-e2e.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  repo:
    name: repo
    uses: ./.github/workflows/ci-repo.yml
    with:
      cache-mode: ${{ inputs.cache-mode }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  # Deletes the BuildKit caches no current image build needs. It runs here,
  # once, rather than in each area's Prune · Caches: blobs are shared across
  # scopes, so one area's prune could delete a blob another area's build is
  # still exporting. A build that failed or was skipped may not have accessed
  # the blobs its scope's index holds, so the prune then waits for the next
  # run. The cache mode is the area files' CACHE_MODE.
  buildkit-prune:
    name: Prune · BuildKit
    needs:
      - cli
      - cluster
    if: >-
      always()
      && needs.cli.outputs.docker-result == 'success'
      && needs.cluster.outputs.docker-result == 'success'
      && (inputs.cache-mode || github.ref == 'refs/heads/main' && 'update' || 'use') != 'use'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # The cutoff is the run's creation, not this attempt's start: a re-run
      # of failed jobs keeps the first attempt's builds.
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          sh scripts/prune-buildkit-caches.sh "$GITHUB_REF" "$cutoff"
