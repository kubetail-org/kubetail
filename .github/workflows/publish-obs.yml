name: publish-obs

permissions:
  contents: read

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - id: config
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          sudo apt install -y osc

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci-config/obs
          sparse-checkout-cone-mode: false
          path: kubetail
          persist-credentials: false

      - name: Download SHA256SUMS
        uses: robinraju/release-downloader@daf26c55d821e836577a15f77d86ddc078948b05 # v1.12
        with:
          repository: kubetail-org/kubetail
          tag: ${{ format('cli/v{0}', steps.config.outputs.version) }}
          fileName: "SHA256SUMS"
          out-file-path: "downloads"

      - name: Extract shasum
        id: meta
        working-directory: ./downloads
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          SHA256=$( tr -d '\r' < './SHA256SUMS' | awk -v f="kubetail-${VERSION}-vendored.tar.gz" '$2 == f {print $1}' )
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Configure osc and checkout project
        env:
          OBS_USERNAME: ${{ vars.OBS_USERNAME }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          cat > ~/.oscrc <<EOF
          [general]
          apiurl = https://api.opensuse.org

          [https://api.opensuse.org]
          user = ${OBS_USERNAME}
          pass = ${OBS_PASSWORD}
          EOF

          osc checkout home:kubetail/kubetail-cli

      - name: Execute templates
        env:
          VERSION: ${{ steps.config.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SRC_DIR: kubetail/.github/ci-config/obs
          DST_DIR: "home:kubetail/kubetail-cli"
        run: |
          export TIMESTAMP=$(LANG=C date '+%a %b %e %Y')

          # .spec
          envsubst '${VERSION} ${TIMESTAMP}' \
            < "${SRC_DIR}/kubetail-cli.spec.tmpl" \
            > "${DST_DIR}/kubetail-cli.spec"

          # _service
          envsubst '${VERSION} ${SHA256}' \
            < "${SRC_DIR}/_service.tmpl" \
            > "${DST_DIR}/_service"

      - name: Publish to OBS
        working-directory: "home:kubetail/kubetail-cli"
        env:
          VERSION: ${{ steps.config.outputs.version }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
        run: |
          osc addremove

          osc status
          osc diff

          if [ "$DRY_RUN" = "false" ]; then
            osc ci -m "Update _service and spec for ${VERSION}"
          else
            cat kubetail-cli.spec
            cat _service
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.oscrc
