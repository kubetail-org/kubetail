name: stress

# Runs every Go test with the CPU count, the order and the repetitions varied,
# to find ordering bugs a single PR run passes. Each runner gets two jobs per
# -cpu value: one under the race detector (but windows/arm64, which has none),
# and one without it, at full speed, where a timing bug the detector's slowdown
# hides can show. A job runs one -cpu value, so a panic or hang under one value
# leaves the others' runs intact.
# A red run means a concurrency bug was found and nothing else.

permissions:
  contents: read

on:
  # 05:00 UTC, a quiet hour when no one waits on the runners.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Repetitions of each test (-count)
        default: "3"
      cpu:
        description: GOMAXPROCS values to run each test under (-cpu), as a JSON array
        default: "[1,4]"

env:
  COUNT: ${{ inputs.count || '3' }}

jobs:
  stress:
    # The report job rebuilds STRESS_ID from the name.
    name: Test (${{ matrix.runner }}, ${{ matrix.race && 'race' || 'norace' }}, cpu ${{ matrix.cpu }})
    # Forks get no nightly run.
    if: github.repository == 'kubetail-org/kubetail' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      # Keep in step with cli-test in ci-cli.yml; anchors do not cross files.
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - windows
        arch:
          - amd64
          - arm64
        race:
          - true
          - false
        # A JSON array, since an expression cannot split a list.
        cpu: ${{ fromJSON(inputs.cpu || '[1,4]') }}
        exclude:
          - os: macos-26
            arch: amd64
          # The race detector does not support windows/arm64.
          - os: windows
            arch: arm64
            race: true
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CPU: ${{ matrix.cpu }}
      RACE: ${{ matrix.race }}
      STRESS_ID: ${{ matrix.runner }}-${{ matrix.race && 'race' || 'norace' }}-cpu${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # -timeout sits under timeout-minutes, so a hang fails the test binary
      # with a goroutine dump rather than the runner killing the job.
      # Each package's result goes to the log as it lands, so a job that dies
      # before its report still shows which package was running.
      - name: Run tests under stress
        shell: bash
        run: |
          race_flag=""
          if [ "$RACE" = true ]; then
            race_flag=-race
          fi
          mkdir -p stress
          status=0
          go test $race_flag -cpu "$CPU" -shuffle=on -count="$COUNT" -timeout 90m -json \
              github.com/kubetail-org/kubetail/... \
            | tee stress/stress.json \
            | jq -rR --unbuffered 'fromjson? | select(.Test == null and (.Action == "pass" or .Action == "fail"))
                | "\(.Action) \(.Package) \(.Elapsed)s"' \
            || status=$?
          go run ./scripts/stress.go -cpu "$CPU" -count "$COUNT" -race="$RACE" \
            -runner "$STRESS_ID" stress/stress.json
          exit "$status"
      # On a cancel, too: timeout-minutes cancels the job, and the partial
      # stress.json is all that says where it stopped.
      - name: Upload failures
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-${{ env.STRESS_ID }}
          path: stress/
          retention-days: 14

  # The desktop's sidecar, a module outside go.work, on the desktop's runners.
  desktop-stress:
    # The report job rebuilds STRESS_ID from the name.
    name: Test · Desktop (${{ matrix.runner }}, ${{ matrix.race && 'race' || 'norace' }}, cpu ${{ matrix.cpu }})
    # Forks get no nightly run.
    if: github.repository == 'kubetail-org/kubetail' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      # Keep in step with runners.json's desktop set.
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - macos-27
          - windows
        arch:
          - amd64
          - arm64
        race:
          - true
          - false
        cpu: ${{ fromJSON(inputs.cpu || '[1,4]') }}
        exclude:
          # The macOS 27 image is Apple silicon alone.
          - os: macos-27
            arch: amd64
          # The race detector does not support windows/arm64.
          - os: windows
            arch: arm64
            race: true
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: amd64
            runner: macos-26-intel
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: macos-27
            arch: arm64
            runner: xcode-27
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CPU: ${{ matrix.cpu }}
      RACE: ${{ matrix.race }}
      STRESS_ID: desktop-${{ matrix.runner }}-${{ matrix.race && 'race' || 'norace' }}-cpu${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          # ci-desktop.yml's Build and Test · Go cache, restored to skip
          # compiling what that job built. This job never saves one: its flags
          # differ from a PR's.
          go-cache-key: desktop-sidecar-test-${{ matrix.os }}-${{ matrix.arch }}
      # As the stress job's. The sidecar's tests read SSH_AUTH_SOCK, as in
      # make test-desktop.
      - name: Run tests under stress
        shell: bash
        env:
          SSH_AUTH_SOCK: ""
        run: |
          race_flag=""
          if [ "$RACE" = true ]; then
            race_flag=-race
          fi
          mkdir -p stress
          status=0
          go -C apps/desktop/sidecar test $race_flag -cpu "$CPU" -shuffle=on -count="$COUNT" -timeout 90m -json ./... \
            | tee stress/stress.json \
            | jq -rR --unbuffered 'fromjson? | select(.Test == null and (.Action == "pass" or .Action == "fail"))
                | "\(.Action) \(.Package) \(.Elapsed)s"' \
            || status=$?
          go run ./scripts/stress.go -cpu "$CPU" -count "$COUNT" -race="$RACE" \
            -runner "$STRESS_ID" stress/stress.json
          exit "$status"
      - name: Upload failures
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-${{ env.STRESS_ID }}
          path: stress/
          retention-days: 14

  # Checks out nothing, so no repo code runs with a write token. Artifact text
  # reaches gh through --body-file and quoted variables, never the command line.
  report:
    name: Report · Failures
    needs:
      - stress
      - desktop-stress
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      # Reads which stress jobs failed, including those that left no artifact,
      # and downloads the artifacts the others left.
      actions: read
      issues: write
    steps:
      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Each artifact lands in stress/<name>/, even a lone one. The download
          # fails when no job left an artifact; a lost runner leaves none.
          if ! gh run download "$RUN_ID" --pattern 'stress-*' --dir stress; then
            echo '::warning::no stress artifact downloaded'
          fi

          gh issue list --search 'in:title Stress' --state open --limit 1000 \
            --json number,title > open.json

          # Comments on the open issue with this title, or opens one.
          file_issue() {
            local title=$1 body=$2 number
            number=$(jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty' open.json)
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              gh issue create --title "$title" --label testing --label lang/go --body-file "$body"
            fi
          }

          # Every stress job that did not pass, by the STRESS_ID its name
          # carries, with how it ended. A test step that never concluded means
          # the runner was lost.
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | startswith("Test (") or startswith("Test · Desktop ("))
                  | select(.conclusion != "success" and .conclusion != "skipped")
                  | [((if .name | startswith("Test · Desktop") then "desktop-" else "" end)
                      + (.name | capture("\\((?<runner>[^,]+), (?<race>[^,]+), cpu (?<cpu>[^)]+)\\)$")
                      | "\(.runner)-\(.race)-cpu\(.cpu)")),
                     (if .conclusion == "cancelled" then "cancelled"
                      elif any(.steps[]; .name == "Run tests under stress" and .conclusion == null) then "lost"
                      else "failed" end)]
                  | @tsv' > failed-jobs.txt

          reports=(stress/*/failures.json)
          if [ ${#reports[@]} -gt 0 ]; then
            jq -s '[.[] | .runner as $r | .failures[] | . + {runner: $r}]' "${reports[@]}" > failures.json
            jq -s '[.[] | .runner as $r | .outside[] | . + {runner: $r}]' "${reports[@]}" > outside.json
          else
            echo '[]' > failures.json
            echo '[]' > outside.json
          fi

          # One issue per failing test, whatever -cpu values it failed under.
          jq -c 'group_by([.package, .test])[]' failures.json | while read -r group; do
            title=$(jq -r '"Stress: \(.[0].test) fails in \(.[0].package)"' <<<"$group")
            jq -r --arg run "$RUN_URL" '
              "The [nightly stress run](\($run)) found `\(.[0].test)` failing in `\(.[0].package)`.\n\n"
              + "Each command runs the whole package from the repo root, since the seed orders all of it.\n\n"
              + (sort_by(.runner, .cpu) | map(
                  "- **\(.runner)**, `-cpu \(.cpu)`, seed `\(.seed)`"
                  + (if .timedOut then ", timed out" else "" end)
                  + "\n\n  ```sh\n  \(.command)\n  ```\n"
                ) | join("\n"))
            ' <<<"$group" > body.md
            file_issue "$title" body.md
          done

          # One issue per package that failed outside a test: a crash, a panic
          # in TestMain, a build failure. Its output is untrusted text, so it
          # sits in a fence longer than any run of backticks in it. Only the
          # first five jobs' output is shown, to keep the body under GitHub's
          # 65536 characters.
          jq -c 'group_by(.package)[]' outside.json | while read -r group; do
            title=$(jq -r '"Stress: \(.[0].package) fails outside a test"' <<<"$group")
            jq -r --arg run "$RUN_URL" '
              def fence: "`" * ([3, ([scan("`+") | length] | max // 0) + 1] | max);
              "The [nightly stress run](\($run)) found `\(.[0].package)` failing outside a test.\n\n"
              + "Each command runs the whole package from the repo root, since the seed orders all of it.\n\n"
              + (sort_by(.runner, .cpu) | to_entries | map(.key as $i | .value |
                  "### \(.runner), `-cpu \(.cpu)`\n\n"
                  + (if (.running | length) > 0
                    then "Running when it failed: " + (.running | map("`\(.)`") | join(", ")) + "\n\n"
                    else "" end)
                  + "```sh\n\(.command)\n```\n"
                  + (if $i >= 5 or .output == "" then ""
                    else (.output | fence) as $f
                      | "\n<details><summary>Output"
                      + (if .omitted > 0 then ", \(.omitted) more lines in the artifact" else "" end)
                      + "</summary>\n\n\($f)text\n\(.output)\($f)\n\n</details>\n"
                    end)
                ) | join("\n"))
            ' <<<"$group" > body.md
            file_issue "$title" body.md
          done

          # A failed job that names no failing test or package: setup, a
          # cancel, a lost runner, or a timeout the test binary missed.
          : > outside.md
          while IFS=$'\t' read -r id ended; do
            report="stress/stress-$id/failures.json"
            if [ ! -f "$report" ]; then
              case $ended in
                cancelled) why="cancelled, likely at timeout-minutes" ;;
                lost) why="the runner was lost mid-run" ;;
                *) why="no test report" ;;
              esac
              if [ -f "stress/stress-$id/stress.json" ]; then
                why="$why; its artifact holds the partial \`stress.json\`"
              fi
              echo "- **$id**: $why" >> outside.md
            elif jq -e '(.outside | length) == 0 and (.failures | length) == 0' "$report" > /dev/null; then
              echo "- **$id**: failed with no failing test or package" >> outside.md
            fi
          done < failed-jobs.txt
          if [ -s outside.md ]; then
            { echo "The [nightly stress run]($RUN_URL) failed outside a test on:"; echo; cat outside.md; } > body.md
            file_issue "Stress run failed outside a test" body.md
          fi
