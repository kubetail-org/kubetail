name: stress

# The nightly stress run. Each area's jobs are in a workflow of their own,
# stress-<area>.yml, which this one calls and which a dispatch also runs alone.
# Each area files its own failures, labelled with its area.
# A red run means a concurrency bug was found and nothing else.

permissions:
  contents: read

on:
  # 05:00 UTC, a quiet hour when no one waits on the runners. The areas' jobs
  # queue for the macOS and Windows runners together, and timeout-minutes
  # counts from when a job starts, so none needs a later start.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Repetitions of each test (-count)
        default: "3"
      cpu:
        description: GOMAXPROCS values to run each test under (-cpu), as a JSON array
        default: "[1,4]"

jobs:
  # Each job's name is its area's stress-id-prefix without the dash:
  # report-stress.yml rebuilds each Test job's STRESS_ID from the
  # "<name> / Test (…)" it carries here. Every area takes the same
  # permissions: its report reads the run's jobs and artifacts (actions: read)
  # and files issues (issues: write).
  cli:
    name: cli
    uses: ./.github/workflows/stress-cli.yml
    with:
      count: ${{ inputs.count }}
      cpu: ${{ inputs.cpu }}
    permissions:
      contents: read
      actions: read
      issues: write

  libs:
    name: libs
    uses: ./.github/workflows/stress-libs.yml
    with:
      count: ${{ inputs.count }}
      cpu: ${{ inputs.cpu }}
    permissions:
      contents: read
      actions: read
      issues: write

  cluster:
    name: cluster
    uses: ./.github/workflows/stress-cluster.yml
    with:
      count: ${{ inputs.count }}
      cpu: ${{ inputs.cpu }}
    permissions:
      contents: read
      actions: read
      issues: write

  desktop:
    name: desktop
    uses: ./.github/workflows/stress-desktop.yml
    with:
      count: ${{ inputs.count }}
      cpu: ${{ inputs.cpu }}
    permissions:
      contents: read
      actions: read
      issues: write
