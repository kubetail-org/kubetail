name: coverage

# The one coverage run of a pull request or a push to main or wip/*. A push to
# wip/* gives the branch's tip the report a PR into it is compared with; ci.yml
# does not run on it, since the merged PR ran its checks. Each area measures
# and gates its coverage in a workflow of its own, coverage-<area>.yml, which
# this one calls, so an area file runs on a pull request only once this one
# calls it.
#
# Each area's Plan job skips the jobs whose paths a pull request did not touch,
# and runs them all on a push. Each Gate waits on its own area's uploads alone.
# No coverage job saves a Go or Rust cache.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - wip/**
  workflow_dispatch:

# A PR's new push cancels its last run. Every other run has a group of its own,
# so every commit on main and wip/* has a report.
concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every area takes the same permissions: its Plan reads the pull request's
  # files (pull-requests: read), and its upload to Codecov authenticates with
  # an OIDC token (id-token: write).
  cli:
    name: cli
    uses: ./.github/workflows/coverage-cli.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  libs:
    name: libs
    uses: ./.github/workflows/coverage-libs.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  cluster:
    name: cluster
    uses: ./.github/workflows/coverage-cluster.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  web:
    name: web
    uses: ./.github/workflows/coverage-web.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write
