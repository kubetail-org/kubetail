name: coverage

# The one coverage run of a pull request or a push to main. Each area measures
# and gates its coverage in a workflow of its own, coverage-<area>.yml, which
# this one calls. Its last job, Coverage · Passed, is the one check the ruleset
# requires.
#
# Each area's Plan job skips the jobs whose paths a pull request did not touch,
# and each Gate waits on its own area's uploads alone.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:

# A PR's new push cancels its last run. Every other run has a group of its own,
# so every commit on main has a report.
concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every area takes the same permissions: its Plan reads the pull request's
  # files (pull-requests: read), and its upload to Codecov authenticates with
  # an OIDC token (id-token: write).
  cli:
    name: cli
    uses: ./.github/workflows/coverage-cli.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  libs:
    name: libs
    uses: ./.github/workflows/coverage-libs.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  cluster:
    name: cluster
    uses: ./.github/workflows/coverage-cluster.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  web:
    name: web
    uses: ./.github/workflows/coverage-web.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write

  # The required check. An area whose Plan skipped every job counts as passed.
  passed:
    name: Coverage · Passed
    needs:
      - cli
      - libs
      - cluster
      - web
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check each area passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
