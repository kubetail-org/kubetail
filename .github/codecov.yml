# Coverage. CI uploads each suite's report and Codecov merges every upload of
# a commit. The coverage / Gate job (tools/coveragegate) reads the merged
# result and applies the gate, so Codecov posts no status or check of its own.

coverage:
  status:
    patch: false
    project: false

github_checks: false

# A language whose jobs the path filter skipped keeps its last report.
flag_management:
  default_rules:
    carryforward: true

# One number per language in Codecov's view of a commit.
component_management:
  individual_components:
    - component_id: go
      name: Go
      paths:
        - cli/**
        - cluster/api/**
        - dashboard/**
        - libs/go-common/**
    - component_id: typescript
      name: TypeScript
      paths:
        - apps/web/**
    - component_id: rust
      name: Rust
      paths:
        - cluster/agent/**

# No comment on the PR: coverage / Gate reports.
comment: false

# A Go profile names files by import path.
fixes:
  - "github.com/kubetail-org/kubetail/::"

ignore:
  # Generated.
  - dashboard/graph/generated.go
  - dashboard/graph/model/models_gen.go
  - cluster/api/graph/generated.go
  - cluster/api/graph/model/models_gen.go
  - libs/go-common/clusteragentpb/**
  - libs/go-common/testpb/**
  - apps/web/src/lib/graphql/*/__generated__/**
  # Test helpers.
  - dashboard/**/mock/**
  - libs/go-common/**/mock/**
  - libs/go-common/testutils/**
  - apps/web/src/mocks/**
  - apps/web/src/test-utils.tsx
