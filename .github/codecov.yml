# Coverage. Each coverage-*.yml uploads its area's reports under the area's
# flags, and Codecov merges every upload of a commit. Each area's Gate job
# (tools/coveragegate) reads its component of the merged result and applies
# the gate, so Codecov posts no status or check of its own.

coverage:
  status:
    patch: false
    project: false

github_checks: false

# An area whose jobs the path filter skipped keeps its last report. Only the
# flags named here carry forward, so a retired flag drops out of the merge.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: cli-linux
      carryforward: true
    - name: cli-darwin
      carryforward: true
    - name: cli-windows
      carryforward: true
    - name: libs-linux
      carryforward: true
    - name: libs-darwin
      carryforward: true
    - name: libs-windows
      carryforward: true
    - name: cluster-api
      carryforward: true
    - name: cluster-agent
      carryforward: true
    - name: web
      carryforward: true
    - name: desktop-sidecar-linux
      carryforward: true
    - name: desktop-sidecar-darwin
      carryforward: true
    - name: desktop-sidecar-windows
      carryforward: true
    - name: desktop-host-linux
      carryforward: true
    - name: desktop-host-darwin
      carryforward: true
    - name: desktop-host-windows
      carryforward: true
    - name: desktop-webview
      carryforward: true

# One component per area. Each gate reads its own, so no other area's flags
# may measure its paths: the CLI's and the Cluster API's tests never measure
# libs/go-common.
component_management:
  individual_components:
    - component_id: cli
      name: CLI
      paths:
        - cli/**
        - dashboard/**
    - component_id: libs
      name: Libs
      paths:
        - libs/go-common/**
    - component_id: cluster
      name: Cluster
      paths:
        - cluster/api/**
        - cluster/agent/**
    - component_id: web
      name: Web
      paths:
        - apps/web/**
    - component_id: desktop
      name: Desktop
      paths:
        - apps/desktop/**

# No comment on the PR: each area's Gate reports.
comment: false

# A Go profile names files by import path.
fixes:
  - "github.com/kubetail-org/kubetail/::"

ignore:
  # Generated.
  - dashboard/graph/generated.go
  - dashboard/graph/model/models_gen.go
  - cluster/api/graph/generated.go
  - cluster/api/graph/model/models_gen.go
  - libs/go-common/clusteragentpb/**
  - libs/go-common/testpb/**
  - apps/web/src/lib/graphql/*/__generated__/**
  - apps/desktop/sidecar/graph/generated.go
  - apps/desktop/sidecar/graph/model/models_gen.go
  - apps/desktop/sidecar/grpc/authpb/**
  - apps/desktop/sidecar/grpc/pokepb/**
  - apps/desktop/sidecar/grpc/monitorpb/**
  - apps/desktop/src/gql/**
  - apps/desktop/src/routeTree.ts
  # Test helpers.
  - dashboard/**/mock/**
  - libs/go-common/**/mock/**
  - libs/go-common/testutils/**
  - apps/web/src/mocks/**
  - apps/web/src/test-utils.tsx
  - apps/desktop/src/test-utils.tsx
  # The desktop's build and CI scripts, run by hand or by go run.
  - apps/desktop/sidecar/scripts/**
  # The webview's entry point.
  - apps/desktop/src/main.tsx
  # Rust files with no line a test can reach; a file with one marks the rest
  # with `// coverage:ignore-start <reason>` instead. The host's entry point:
  - apps/desktop/src-tauri/src/main.rs
  # The macOS menu bar's construction: AppKit builds menus on the main thread,
  # which no test runs on. What an item does is tested in app_menu/mod.rs.
  - apps/desktop/src-tauri/src/app_menu/macos.rs
  # The macOS Dock menu and Quit reply's AppKit patching, likewise on the main
  # thread. What an item does and the reply are tested in dock_menu/mod.rs.
  - apps/desktop/src-tauri/src/dock_menu/macos.rs
  # The macOS notification center's glue: it serves only a signed app in its
  # bundle, which no test runs as. What an answer and a press mean is tested in
  # alerts/.
  - apps/desktop/src-tauri/src/alerts/macos.rs
  # The OS glue that registers for wake and network notifications on the
  # system bus or the Win32 API.
  - apps/desktop/src-tauri/src/wake/linux.rs
  - apps/desktop/src-tauri/src/wake/windows.rs
  # The updater plugin's wiring: a real release, its network and its installer.
  # The check loop and the offer are tested in updater/mod.rs.
  - apps/desktop/src-tauri/src/updater/platform.rs
