# Coverage. Each coverage-*.yml uploads its area's reports under the area's
# flags, and Codecov merges every upload of a commit. Each area's Gate job
# (tools/coveragegate) reads its component of the merged result and applies
# the gate, so Codecov posts no status or check of its own.

coverage:
  status:
    patch: false
    project: false

github_checks: false

# An area whose jobs the path filter skipped keeps its last report. Only the
# flags named here carry forward, so a retired flag drops out of the merge.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: cli-linux
      carryforward: true
    - name: cli-darwin
      carryforward: true
    - name: cli-windows
      carryforward: true
    - name: libs-linux
      carryforward: true
    - name: libs-darwin
      carryforward: true
    - name: libs-windows
      carryforward: true
    - name: cluster-api
      carryforward: true
    - name: cluster-agent
      carryforward: true
    - name: web
      carryforward: true

# One component per area. Each gate reads its own, so no other area's flags
# may measure its paths: the CLI's and the Cluster API's tests never measure
# libs/go-common.
component_management:
  individual_components:
    - component_id: cli
      name: CLI
      paths:
        - cli/**
        - dashboard/**
    - component_id: libs
      name: Libs
      paths:
        - libs/go-common/**
    - component_id: cluster
      name: Cluster
      paths:
        - cluster/api/**
        - cluster/agent/**
    - component_id: web
      name: Web
      paths:
        - apps/web/**

# No comment on the PR: each area's Gate reports.
comment: false

# A Go profile names files by import path.
fixes:
  - "github.com/kubetail-org/kubetail/::"

ignore:
  # Generated.
  - dashboard/graph/generated.go
  - dashboard/graph/model/models_gen.go
  - cluster/api/graph/generated.go
  - cluster/api/graph/model/models_gen.go
  - libs/go-common/clusteragentpb/**
  - libs/go-common/testpb/**
  - apps/web/src/lib/graphql/*/__generated__/**
  # Test helpers.
  - dashboard/**/mock/**
  - libs/go-common/**/mock/**
  - libs/go-common/testutils/**
  - apps/web/src/mocks/**
  - apps/web/src/test-utils.tsx
