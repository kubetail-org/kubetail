---
# Dependabot moves dependencies, never toolchains: the Go version (each go.mod
# and setup-environment's go-version), packageManager in apps/web/package.json
# and apps/desktop/package.json, setup-environment's node-version and the
# @types/node major that matches it, cluster/agent/rust-toolchain.toml and
# apps/desktop/src-tauri/rust-toolchain.toml, setup-environment's
# kubectl-version, and the golang, node and rust images in the Dockerfiles are
# bumped by hand, each image with its digest. make lint-repo-toolchains checks
# the Dockerfiles and the desktop's pins against CI.
#
# Every ecosystem waits after a release (time for a compromised release to be
# caught and pulled first), groups minor and patch updates into one weekly PR,
# and leaves each major in a PR of its own unless a named group takes it.
# Security updates skip the wait and arrive grouped.
version: 2
updates:
  # Every action is pinned to a commit SHA; this moves the pins and the
  # version comments beside them.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, ci/cd]
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # /tools holds actionlint, govulncheck and the protoc plugins, so CI's copies
  # move with the rest.
  - package-ecosystem: gomod
    directories:
      - /cli
      - /cluster/api
      - /dashboard
      - /libs/go-common
      - /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/go]
    commit-message:
      prefix: chore
      include: scope
    # actionlint v1.7.12 builds only against go.yaml.in/yaml/v4
    # v4.0.0-rc.3, and Go gives releasenotes the same version. Drop this
    # once an actionlint release requires v4.0.0.
    ignore:
      - dependency-name: go.yaml.in/yaml/v4
    groups:
      # client-go and apimachinery release in lockstep.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # A plugin update changes the *.pb.go headers, so its PR fails Check ·
      # Generated until someone runs make generate on it. This group keeps
      # that PR apart from the go group's, and moves the protobuf runtime with
      # its plugin. A dependency joins the first group it matches.
      protobuf:
        patterns:
          - google.golang.org/protobuf
          - google.golang.org/grpc/cmd/protoc-gen-go-grpc
      go:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The desktop's sidecar, in PRs of its own: it is a module outside go.work,
  # with its own fsnotify.
  - package-ecosystem: gomod
    directory: /apps/desktop/sidecar
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/go]
    commit-message:
      prefix: chore
      include: scope
    groups:
      desktop-kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      desktop-go:
        update-types: [minor, patch]
      desktop-go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /cluster/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/rust]
    commit-message:
      prefix: chore
      include: scope
    groups:
      rust:
        update-types: [minor, patch]
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, lang/rust]
    commit-message:
      prefix: chore
      include: scope
    # Tauri's crates and its npm packages must share a major.minor, and no
    # group spans ecosystems: those bumps are made by hand, in one PR. A
    # plugin's minor can require a newer tauri minor, so plugins wait too.
    ignore:
      - dependency-name: tauri
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tauri-build
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tauri-plugin-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # system-configuration's API takes core-foundation's types, so the two
      # must share a core-foundation version and move together.
      desktop-core-foundation:
        patterns:
          - core-foundation
          - system-configuration
      desktop-rust:
        update-types: [minor, patch]
      desktop-rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    # pnpm-workspace.yaml's minimumReleaseAge is ten days, and pnpm refuses
    # to resolve a younger release.
    cooldown:
      default-days: 10
    labels: [dependencies, lang/ts+react]
    commit-message:
      prefix: chore
      include: scope
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The @graphql-codegen packages release their majors together.
      graphql-codegen:
        patterns:
          - "@graphql-codegen/*"
      npm:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    # pnpm-workspace.yaml's minimumReleaseAge is seven days.
    cooldown:
      default-days: 7
    labels: [dependencies, lang/ts+react]
    commit-message:
      prefix: chore
      include: scope
    versioning-strategy: increase
    ignore:
      # See the desktop's cargo ignore.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@tauri-apps/cli"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      desktop-graphql-codegen:
        patterns:
          - "@graphql-codegen/*"
      desktop-npm:
        update-types: [minor, patch]
      desktop-npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The runtime bases (alpine, busybox) and grpc-health-probe ship in the
  # release images. Each is pinned by tag and digest, and this moves both.
  - package-ecosystem: docker
    directories:
      - /cli
      - /cluster/agent
      - /cluster/api
      - /dashboard
      - /hack/tilt
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, packaging]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: golang
      - dependency-name: node
      - dependency-name: rust
    groups:
      docker:
        patterns:
          - "*"
