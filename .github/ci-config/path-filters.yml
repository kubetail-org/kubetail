# dorny/paths-filter's filters, read by the Plan jobs of ci.yml, codeql.yml
# and coverage.yml. A pull request runs a group's jobs, and measures its
# coverage, only when a path in it changed, so the two cannot drift: a path
# that ran the tests but not the coverage would pass its changed lines as "0 of
# 0 covered". A change to how CI runs or measures (shared) runs every language.
shared: &shared
  - .github/actions/setup-environment/**
  - .github/ci-config/path-filters.yml
  - .github/codecov.yml
  - .github/workflows/ci.yml
  - .github/workflows/coverage.yml
  - scripts/check-coverage-markers.sh
  - scripts/check-license-headers.sh
  - tools/**
go:
  - *shared
  - Makefile
  - cli/**
  - cluster/api/**
  - dashboard/**
  - go.work
  - go.work.sum
  - libs/go-common/**
  - libs/graphql/**
  - scripts/check-go-fix.sh
  - scripts/staticcheck.sh
  - tools/go.mod
  - tools/go.sum
rust:
  - *shared
  - cluster/agent/**
  - libs/proto/**
typescript:
  - *shared
  - Makefile
  - apps/web/**
  - cli/Dockerfile
  - dashboard/Dockerfile
  # apps/web/codegen.ts generates the UI's types from these.
  - libs/graphql/**
# ci.yml's Docker · Build alone: a PR builds every image only when a
# Dockerfile changed.
docker:
  - *shared
  - cli/Dockerfile
  - cluster/agent/Dockerfile
  - cluster/api/Dockerfile
  - dashboard/Dockerfile
shell:
  - .github/workflows/ci.yml
  - .github/ci-config/path-filters.yml
  - Makefile
  - '**/*.sh'
yaml:
  - .github/**
  - .yamllint.yml
  - .yamllintignore
  - Makefile
  - tools/go.mod
  - '**/*.yml'
  - '**/*.yaml'
# ci.yml's Generated · Check alone: every source a generator reads, and the
# generators' pins.
generated:
  - *shared
  - Makefile
  - apps/web/codegen.ts
  - apps/web/package.json
  - apps/web/pnpm-lock.yaml
  - apps/web/src/lib/graphql/**
  - cli/**
  - cluster/api/**
  - config/default/cli.*
  - dashboard/**
  - libs/go-common/**
  - libs/graphql/**
  - libs/proto/**
  - scripts/check-generated.sh
# codeql.yml's alone. A change to codeql.yml analyzes every language.
codeql:
  - .github/workflows/codeql.yml
python:
  - e2e/**
actions:
  - .github/actions/**
  - .github/workflows/**
# Each component's release stream: the paths tools/releasenotes reads a
# release's commits from. paths-filter computes them too, and no job acts on
# them. A directory a component starts to ship goes in its filter, or its pull
# requests leave the notes.
release-cli:
  - apps/web/**
  - cli/**
  - config/default/cli.*
  - dashboard/**
  - libs/go-common/**
  - libs/graphql/dashboard/**
  # The paths before the move to one folder per component, until each
  # component has released once from the new layout.
  - build/package/Dockerfile.cli
  - dashboard-ui/**
  - modules/cli/**
  - modules/dashboard/**
  - modules/shared/**
release-dashboard:
  - apps/web/**
  - config/default/dashboard.yaml
  - dashboard/**
  - libs/go-common/**
  - libs/graphql/dashboard/**
  # Before the move to one folder per component.
  - build/package/Dockerfile.dashboard
  - dashboard-ui/**
  - modules/dashboard/**
  - modules/shared/**
release-cluster-api:
  - cluster/api/**
  - config/default/cluster-api.yaml
  - libs/go-common/**
  - libs/graphql/cluster-api/**
  - libs/proto/**
  # Before the move to one folder per component.
  - build/package/Dockerfile.cluster-api
  - modules/cluster-api/**
  - modules/shared/**
  - proto/**
release-cluster-agent:
  - cluster/agent/**
  - config/default/cluster-agent.yaml
  - libs/proto/**
  # Before the move to one folder per component.
  - build/package/Dockerfile.cluster-agent
  - crates/**
  - proto/**
