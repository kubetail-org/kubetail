# dorny/paths-filter's filters. Each key is narrow, and the Plan job of each
# area's ci-*.yml and coverage-*.yml, and of codeql.yml, composes its jobs
# from them (.github/actions/plan). An area's coverage-*.yml composes the same keys as
# its ci-*.yml, so the two cannot drift: a path that ran the tests but not the
# coverage would pass its changed lines as "0 of 0 covered". Each area's two
# workflows are in its own key. A change to how CI runs or measures (shared)
# runs every area.
#
# The Plan action matches with predicate-quantifier 'some-with-excludes': a
# path is in a key when it matches one of its patterns and none of its '!'
# patterns. A key that runs code jobs ends in '!**/*.md', so a pull request
# that changes only Markdown runs the Markdown checks alone. A key merged in
# with an anchor brings its exclusions along.
shared: &shared
  - .github/actions/plan/**
  - .github/actions/setup-environment/**
  - .github/ci-config/path-filters.yml
  - .github/ci-config/runners.json
  - .github/codecov.yml
  - .github/workflows/ci.yml
  - .github/workflows/coverage.yml
  - Makefile
  - scripts/check-coverage-markers.sh
  - scripts/check-license-headers.sh
  - tools/**
  - '!**/*.md'
cli:
  - .github/workflows/ci-cli.yml
  - .github/workflows/coverage-cli.yml
  - cli/**
  - '!**/*.md'
dashboard:
  - dashboard/**
  - '!**/*.md'
libs:
  - .github/workflows/ci-libs.yml
  - .github/workflows/coverage-libs.yml
# libs/go-common and what every Go module builds with.
go-common:
  - go.work
  - go.work.sum
  - libs/go-common/**
  - scripts/check-go-fix.sh
  - scripts/go-builds.sh
  - scripts/staticcheck.sh
  - '!**/*.md'
graphql-dashboard:
  - libs/graphql/dashboard/**
  - '!**/*.md'
graphql-cluster-api:
  - libs/graphql/cluster-api/**
  - '!**/*.md'
cluster-api:
  - .github/workflows/ci-cluster.yml
  - .github/workflows/coverage-cluster.yml
  - cluster/api/**
  - '!**/*.md'
cluster-agent:
  - .github/workflows/ci-cluster.yml
  - .github/workflows/coverage-cluster.yml
  - cluster/agent/**
  - '!**/*.md'
proto:
  - libs/proto/**
  - '!**/*.md'
web:
  - .github/workflows/ci-web.yml
  - .github/workflows/coverage-web.yml
  - apps/web/**
  - '!**/*.md'
desktop:
  - .github/workflows/ci-desktop.yml
  - .github/workflows/coverage-desktop.yml
  - '!**/*.md'
# The desktop's sidecar, and what Check · AppArmor profiles builds and runs.
desktop-sidecar:
  - apps/desktop/proto/**
  - apps/desktop/scripts/**
  - apps/desktop/sidecar/**
  - apps/desktop/src-tauri/linux/**
  - scripts/check-go-fix.sh
  - scripts/go-builds.sh
  - scripts/go-vet.sh
  - scripts/restore-mtime.go
  - scripts/staticcheck.sh
  - '!**/*.md'
# The desktop's host builds against a stub sidecar, so the sidecar is not its
# input, but its tests read the sidecar's layout fixture.
desktop-host:
  - .github/actions/stub-sidecar/**
  - apps/desktop/proto/**
  - apps/desktop/sidecar/internal/app/layout/testdata/**
  - apps/desktop/src-tauri/**
  - '!**/*.md'
desktop-webview:
  - .gitignore
  - apps/desktop/*.ts
  - apps/desktop/.oxfmtrc.json
  - apps/desktop/.oxlintrc*.json
  - apps/desktop/index.html
  - apps/desktop/lint/**
  - apps/desktop/package.json
  - apps/desktop/pnpm-lock.yaml
  - apps/desktop/pnpm-workspace.yaml
  - apps/desktop/public/**
  - apps/desktop/sidecar/graph/schema.graphqls
  - apps/desktop/src/**
  # index.test.ts checks src/assets/icons/ against the masters.
  - apps/desktop/src-icons/**
  - apps/desktop/tsconfig*.json
  - '!**/*.md'
# The design manifest and every file an entry in it can name.
desktop-design:
  - apps/desktop/design/**
  - apps/desktop/src/components/**
  - apps/desktop/src/layouts/**
  - apps/desktop/src/routes/**
  - '!**/*.md'
# The security model cites tests and files anywhere in the app, and is
# Markdown itself.
desktop-security-model:
  - apps/desktop/**
e2e:
  - .github/workflows/ci-e2e.yml
  - e2e/**
  - '!**/*.md'
repo:
  - .github/workflows/ci-repo.yml
# Every image and target: without it, a PR builds the cli image's final stage
# alone.
docker:
  - *shared
  - cli/Dockerfile
  - cluster/agent/Dockerfile
  - cluster/api/Dockerfile
  - dashboard/Dockerfile
  - '!**/*.md'
shell:
  - .github/ci-config/path-filters.yml
  - .github/ci-config/runners.json
  - Makefile
  - '**/*.sh'
yaml:
  - .github/**
  - .yamllint.yml
  - .yamllintignore
  - Makefile
  - tools/go.mod
  - '**/*.yml'
  - '**/*.yaml'
# Check · Generated alone: every source a generator reads, and the
# generators' pins.
generated:
  - *shared
  - apps/web/codegen.ts
  - apps/web/package.json
  - apps/web/pnpm-lock.yaml
  - apps/web/src/lib/graphql/**
  - cli/**
  - cluster/api/**
  - config/default/cli.*
  - dashboard/**
  - libs/go-common/**
  - libs/graphql/**
  - libs/proto/**
  - scripts/check-generated.sh
  - scripts/generate.sh
  - '!**/*.md'
# codeql.yml's alone. A change to codeql.yml analyzes every language.
codeql:
  - .github/workflows/codeql.yml
# The nightly stress run's report script, outside every module.
stress:
  - scripts/stress.go
  - scripts/stress_test.go
python:
  - e2e/**
  - '!**/*.md'
actions:
  - .github/actions/**
  - .github/workflows/**
# Each component's release stream: the paths tools/releasenotes reads a
# release's commits from. paths-filter computes them too, and no job acts on
# them. A directory a component starts to ship goes in its filter, or its pull
# requests leave the notes.
release-cli:
  - apps/web/**
  - cli/**
  - config/default/cli.*
  - dashboard/**
  - libs/go-common/**
  - libs/graphql/dashboard/**
  # The paths before the move to one folder per component, until each
  # component has released once from the new layout.
  - build/package/Dockerfile.cli
  - dashboard-ui/**
  - modules/cli/**
  - modules/dashboard/**
  - modules/shared/**
release-dashboard:
  - apps/web/**
  - config/default/dashboard.yaml
  - dashboard/**
  - libs/go-common/**
  - libs/graphql/dashboard/**
  # Before the move to one folder per component.
  - build/package/Dockerfile.dashboard
  - dashboard-ui/**
  - modules/dashboard/**
  - modules/shared/**
release-cluster-api:
  - cluster/api/**
  - config/default/cluster-api.yaml
  - libs/go-common/**
  - libs/graphql/cluster-api/**
  - libs/proto/**
  # Before the move to one folder per component.
  - build/package/Dockerfile.cluster-api
  - modules/cluster-api/**
  - modules/shared/**
  - proto/**
release-cluster-agent:
  - cluster/agent/**
  - config/default/cluster-agent.yaml
  - libs/proto/**
  # Before the move to one folder per component.
  - build/package/Dockerfile.cluster-agent
  - crates/**
  - proto/**
release-desktop:
  - apps/desktop/proto/**
  - apps/desktop/public/**
  - apps/desktop/sidecar/**
  - apps/desktop/src/**
  - apps/desktop/src-icons/**
  - apps/desktop/src-tauri/**
